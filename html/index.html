<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>東吳大學導覽介紹</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #fcfaf2; 
            color: #333;
            margin: 20px;
        }

        header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #d32f2f;
            padding-bottom: 10px;
        }

        .logo {
            margin-right: 15px;
        }

        .main-container {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .sidebar {  /* 左選單 */
            width: 260px;
            background-color: white;
            border: 2px solid #333;
        }

        .sidebar-title {
            background-color: #d32f2f;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .sidebar ol {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 550px;
            overflow-y: auto;
        }

        .sidebar li {
            padding: 12px 20px;
            border-bottom: 1px solid #333;
            background-color: beige;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: 0.2s;
        }

        .sidebar li::before {
            content: "•";
            margin-right: 10px;
            color: #d32f2f;
            font-weight: bold;
        }

        .sidebar li:hover {  
            background-color: #f0f0e0;
            padding-left: 30px;
            color: #d32f2f;
        }

        .content-area {
            flex: 1;
        }

        .path-bar {
            background-color: #333;
            color: white;
            padding: 10px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .image-display { /* 右側圖片展示區 */
            background-color: white;
            border: 2px solid #333;
            padding: 20px;   
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 550px;
            max-height: 600px;
            overflow: hidden;
        }

        .image-display img {
            max-width: 100%;
            max-height: 100%;
            border: 1px solid #ccc;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <header>
        <img src="logo.png" width="60" height="60" class="logo" alt="東吳校徽">
        <h1>東吳大學校園導覽</h1>
    </header>

    <div class="main-container">
        <nav class="sidebar">
            <div class="sidebar-title">大樓介紹選單項目</div>
            <ol id="building-menu">
                <li>A 棟</li><li>B 棟</li><li>C 棟</li><li>D 棟</li><li>E 棟</li>
                <li>F 棟</li><li>G 棟</li><li>H 棟</li><li>I 棟</li><li>K 棟</li>
                <li>L 棟</li><li>M 棟</li><li>N 棟</li><li>P 棟</li><li>Q 棟</li>
                <li>R 棟</li><li>操場</li>
            </ol>
        </nav>

        <main class="content-area">
            <div class="path-bar" id="current-building">
                東吳大學地圖
            </div>
            <div class="image-display">
                <img id="display-img" src="Scu.png" alt="校園景觀">
            </div>
        </main>
    </div>

    <script>
        // 1. 抓取元件
        const menuItems = document.querySelectorAll('#building-menu li');
        const photo = document.getElementById('display-img');
        const titleBar = document.getElementById('current-building');

        // 2. 設定點擊邏輯
        menuItems.forEach(item => {
            item.addEventListener('click', function() {
                // 取得文字並移除空格 (例如 "A 棟" 變成 "A棟")
                const name = this.innerText.trim().replace(/\s+/g, '');
                
                // 更新上方藍條文字
                titleBar.innerText = "東吳大學 - " + name;

                // 3. 換圖判斷邏輯
                // 請確認你的 H 資料夾內有這些照片檔案
                if (name === "B棟") {
                    photo.src = "H/H02.jpg";
                } else if (name === "C棟") {
                    photo.src = "H/H03.jpg";
                } else if (name === "操場") {
                    photo.src = "H/H04.jpg";
                } else if (name === "H棟" || name === "A棟") {
                    photo.src = "H/H01.jpg";
                } else {
                    // 如果點到 D~R 棟目前還沒設定照片，顯示預設大地圖
                    photo.src = "Scu.png";
                }

                // 4. 選單顏色回饋
                menuItems.forEach(i => i.style.color = ""); // 先重設所有人
                this.style.color = "#d32f2f"; // 被點到的變紅
                this.style.fontWeight = "bold";
            });
        });

        // 檢查圖片加載失敗的處理 (Debug 用)
        photo.onerror = function() {
            console.error("圖片讀取失敗，請檢查路徑與檔名是否正確！");
        };
    </script>
</body>
</html>
