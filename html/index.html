<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>東吳大學導覽介紹</title>
    <style>
        li{
            background-color: beige;
        }
        </style>
</head>
<body>
    <img src="logo.png" width="60" height="60" style="float:left;"/>
    <h1>東吳大學</h1>
    g<hr/>
    <ul style = "background-color: beige; margin:0px; padding:15px;">
    <li>A棟</li>
    <li>B棟</li>
    <li>C棟</li>
    <li>D棟</li>
    <li>E棟</li>
    <li>F棟</li>
    <li>G棟</li>
    <li>H棟</li>
    <li>I棟</li>
    <li>K棟</li>
    <li>L棟</li>
    <li>M棟</li>
    <li>N棟</li>
    <li>P棟</li>
    <li>Q棟</li>
    <li>R棟</li>
    <li>操場</li>

    <img src="H/H01.jpg" width="700" height="500" >
 <img id="campus-photo" src="H/H01.jpg" width="700" height="500">
    
    <script>
        // 抓取所有的 <li> 選項
        const listItems = document.querySelectorAll('li');
        // 抓取照片標籤
        const photo = document.getElementById('campus-photo');

        // 設定點擊功能
        listItems.forEach(item => {
            item.style.cursor = "pointer"; // 讓滑鼠移上去變小手圖示

            item.addEventListener('click', function() {
                const name = this.innerText; // 取得你點的文字，例如 "B棟"
                
                // 根據你點的文字換照片 (請確認 H 資料夾裡有這些檔案)
                if (name.includes("B棟")) {
                    photo.src = "H/H02.jpg";
                } else if (name.includes("C棟")) {
                    photo.src = "H/H03.jpg";
                } else if (name.includes("操場")) {
                    photo.src = "H/H04.jpg";
                } else {
                    // 其他選項預設回第一張
                    photo.src = "H/H01.jpg";
                }

                console.log("當前切換至：" + name);
            });
        });
    </script>   
</body>
</html>
