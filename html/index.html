<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>東吳大學導覽介紹</title>
    <style>
        li{
            background-color: beige;
        }
        </style>
</head>
<body>
    <img src="logo.png" width="60" height="60" style="float:left;"/>
    <h1>東吳大學</h1>
<ol type="I">
    <li>A棟</li>
    <li>B棟</li>
    <li>C棟</li>
    <li>D棟</li>
    <li>E棟</li>
    <li>F棟</li>
    <li>G棟</li>
    <li>H棟</li>
    <li>I棟</li>
    <li>K棟</li>
    <li>L棟</li>
    <li>M棟</li>
    <li>N棟</li>
    <li>P棟</li>
    <li>Q棟</li>
    <li>R棟</li>
    <li>操場</li>


    
</body>
</html> 
<script>
    // 等待網頁內容載入完成
document.addEventListener('DOMContentLoaded', function() {
    // 1. 取得所有的清單項目 (li)
    const menuItems = document.querySelectorAll('ul li');
    // 2. 取得要顯示圖片的 img 標籤
    const displayImage = document.getElementById('building-image');

    // 3. 為每一個 li 加上點擊事件監聽
    menuItems.forEach(item => {
        item.addEventListener('click', function() {
            // 取得該 li 身上 data-image 的值
            const imageName = this.getAttribute('data-image');
            
            // 如果有設定圖片名稱，就更換圖片路徑
            if (imageName) {
                displayImage.src = imageName;
                
                // 選做：可以加上一點視覺效果，例如改變選中項目的顏色
                menuItems.forEach(li => li.style.fontWeight = 'normal');
                this.style.fontWeight = 'bold';
            }
        });
    });
});

</script>
