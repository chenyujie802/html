<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>東吳大學導覽介紹</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #fcfaf2; 
            color: #333;
            margin: 20px;
        }

        header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #d32f2f;
            padding-bottom: 10px;
        }

        .logo { margin-right: 15px; }

        .main-container {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .sidebar {  /* 左選單樣式 */
            width: 260px;
            background-color: white;
            border: 2px solid #333;
        }

        .sidebar-title {
            background-color: #d32f2f;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
        }

        .sidebar ol {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 550px;
            overflow-y: auto;
        }

        .sidebar li {
            padding: 12px 20px;
            border-bottom: 1px solid #333;
            background-color: beige;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: 0.2s;
        }

        .sidebar li::before {
            content: "•";
            margin-right: 10px;
            color: #d32f2f;
            font-weight: bold;
        }

        .sidebar li:hover {  
            background-color: #f0f0e0;
            padding-left: 30px;
            color: #d32f2f;
        }

        .content-area { flex: 1; }

        .path-bar {
            background-color: #333;
            color: white;
            padding: 10px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .image-display { 
            background-color: white;
            border: 2px solid #333;
            padding: 20px;   
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 550px;
        }

        .image-display img {
            max-width: 100%;
            max-height: 500px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

    <header>
        <img src="logo.png" width="60" height="60" class="logo" alt="東吳校徽">
        <h1>東吳大學校園導覽</h1>
    </header>

    <div class="main-container">
        <nav class="sidebar">
            <div class="sidebar-title">大樓介紹選單項目</div>
            <ol id="building-menu">
                <li>A 棟</li><li>B 棟</li><li>C 棟</li><li>D 棟</li><li>E 棟</li>
                <li>F 棟</li><li>G 棟</li><li>H 棟</li><li>I 棟</li><li>K 棟</li>
                <li>L 棟</li><li>M 棟</li><li>N 棟</li><li>P 棟</li><li>Q 棟</li>
                <li>R 棟</li><li>操場</li>
            </ol>
        </nav>

        <main class="content-area">
            <div class="path-bar" id="current-building">東吳大學地圖</div>
            <div class="image-display">
                <img id="display-img" src="Scu.png" alt="校園景觀">
            </div>
        </main>
    </div>

    <script>
        const menuItems = document.querySelectorAll('#building-menu li');
        const photo = document.getElementById('display-img');
        const titleBar = document.getElementById('current-building');

        menuItems.forEach(item => {
            item.addEventListener('click', function() {
                // 1. 處理文字：去掉空格 (讓 "B 棟" 變成 "B棟")
                const name = this.innerText.trim().replace(/\s+/g, '');
                
                // 2. 更新標題
                titleBar.innerText = "東吳大學 - " + name;

                // 3. 換圖邏輯 (對應你的 801.jpg ~ 804.jpg)
                if (name === "A棟" || name === "H棟") {
                    photo.src = "H/801.jpg";
                } else if (name === "B棟") {
                    photo.src = "H/802.jpg";
                } else if (name === "C棟") {
                    photo.src = "H/803.jpg";
                } else if (name === "操場") {
                    photo.src = "H/804.jpg";
                } else {
                    photo.src = "Scu.png";
                }

                // 4. 點擊回饋：變色
                menuItems.forEach(i => {
                    i.style.color = "";
                    i.style.fontWeight = "";
                });
                this.style.color = "#d32f2f";
                this.style.fontWeight = "bold";
            });
        });
    </script>
</body>
</html>
